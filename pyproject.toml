[project]
name = "ralph-and-tommy"
version = "0.1.0"
description = "Buyer and seller agents that negotiate bulk secondhand-clothing deals, with secret limits kept out of the AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastembed>=0.9.1",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
fleek = "fleek_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleek_agents"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "fleek_agents"

[[tool.importlinter.contracts]]
name = "Agents and the AI client never import the vault, directly or indirectly"
type = "forbidden"
source_modules = ["fleek_agents.agents", "fleek_agents.llm"]
forbidden_modules = ["fleek_agents.vault"]

[[tool.importlinter.contracts]]
name = "The domain stays pure: no database, no vault"
type = "forbidden"
source_modules = ["fleek_agents.domain"]
forbidden_modules = ["fleek_agents.store", "fleek_agents.vault"]
