# Numbers we expect to tune. Each is checked when it's loaded.

[bands]
# How close a price is to a side's own limit, as a % of that limit.
# At or under strong_pct: strong. At or under acceptable_pct: acceptable. Up to 100: stretch.
strong_pct = 85
acceptable_pct = 95

[negotiation]
# Offers plus counter-offers in one negotiation. After the last, a side can only accept or walk away.
max_rounds = 6
# Fleek's Make an Offer: 48 hours to answer, or the offer expires.
answer_hours = 48
# After a negotiation ends without a deal, the same buyer waits this long before retrying that lot.
cooldown_hours = 24
# Failed negotiations one buyer may have on one lot, ever (eBay Best Offer: 3 offers per buyer
# per item). Each try tells a buyer something about the floor.
tries_per_buyer_per_lot = 3

[models]
# Deals worth this much or more (whole pence) get the stronger model.
big_deal_pence = 100000
big_deal_model = "claude-sonnet-5-5"
small_deal_model = "claude-haiku-5-5"
digest_model = "claude-opus-5-5"

[spending]
# Caps on AI cost, in US cents. A call that could break either cap is never made.
negotiation_cap_cents = 25
run_cap_cents = 500

# Anthropic list prices, US cents per million tokens (checked 30 Oct 2026).
[spending.prices.claude-haiku-5-5]
input_cents_per_mtok = 10
output_cents_per_mtok = 50

[spending.prices.claude-sonnet-5-5]
input_cents_per_mtok = 200
output_cents_per_mtok = 1000

[spending.prices.claude-opus-5-5]
input_cents_per_mtok = 400
output_cents_per_mtok = 2000

[approval]
# An agreed deal waits for a person if it costs the buyer this much or more (whole pence)...
person_at_or_above_pence = 150000
# ...or if it's one of the buyer's first deals. Otherwise the rule approves it.
first_deals_by_person = 3
# ...or if the agreed price is below this % of the list price: unusual enough for a second look.
# Also: a buyer the monitors flagged (probing, coming back, many new accounts) always waits.
# On top of these, a buyer or seller who chose final_say = person approves each deal themselves.
unusual_below_pct = 60

[digest]
# A failed negotiation is a near miss if the last offer and counter ended this close (% of the counter).
near_miss_gap_pct = 10
list_size = 20

[privacy]
# Hides the seller's floor in Tommy's moves: a secret margin on each lot's floor (0 to
# margin_max_pct %) and noise on his counters (about noise_pct % of list, shrinking each round).
# Measured with `fleek leak --privacy` and `fleek leak --sweep`.
# Off here because the recorded Claude runs (Deal Room, simulate, safety) were made without it,
# and a replay only answers the exact requests it saw. The bench turns it on.
# Chosen from the sweep (1 Nov): the only setting that met both marks set before measuring
# (strongest attacker's hit rate cut by 40%+, fewer than 5 points of deals lost). Noise is 0:
# measured, it never helped against an attacker who knows the code.
on = false
margin_max_pct = 8
noise_pct = 0

[match_gate]
# Matching's yes/no ("could any price work for this buyer and lot?") is about two secrets. Asked
# freely with different top prices, it pins a floor in about 12 questions. The gate rations it:
# a budget of answers per lot per day (shared by every account), top prices rounded down to a
# grid of grid_pct % of the delivered list price, and the same answer to a repeated question.
# Measured with `fleek leak --route matching`. A budget of 5 refused half of real buyers'
# matches on the seeded market; 20 refuses about 1 question in 800. Off here for the same
# reason as [privacy].
on = false
answers_per_lot_per_day = 20
grid_pct = 5
# A lot is crowded when this many accounts in one day asked about it and about nothing else:
# real buyers' searches touch every lot that fits; an attacker's fresh accounts ask about one.
# Measured with `fleek monitors`: what it catches, and how often it fires on real buyers.
crowd_accounts = 5

[matching]
# How the lots that could work are ranked, in points. Public facts only: how well the lot fits the
# buyer's words, its delivered price against the other candidates, the seller's rating (out of 5)
# and dispatch days. The vault has already said which lots could work; ranking never reads a limit.
fit = 50
price = 25
quality = 15
speed = 10
