name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code. It can't push, comment or change settings.
permissions:
  contents: read

# A new push to the same PR cancels the run that's now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, key scan
    # Pinned: ubuntu-latest changes under you (it's moving to 26.04). Upgrade on purpose instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLEEK_MODEL_CACHE: .cache/models
    steps:
      # Pinned to commit SHAs: a tag like v7 can be moved to different code; a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.18" # the same uv as on the dev machine
      # The 64 MB embedding model, downloaded once and reused by later runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-bge-small-en-v1.5
      # --locked: fail if uv.lock doesn't match pyproject.toml, instead of quietly updating it.
      - run: uv sync --locked
      - run: make check
